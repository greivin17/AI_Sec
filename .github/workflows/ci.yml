name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: Lint (ruff)
        run: ruff check . --select E,W,F,I

      - name: Unit tests
        run: pytest ../tests/unit/ -v --tb=short
        env:
          WORKSPACE_STORAGE_ACCOUNT: ""
          AUDIT_STORAGE_ACCOUNT: ""
          APP_CONFIG_ENDPOINT: ""
          DCE_ENDPOINT: ""
          DCR_IMMUTABLE_ID: ""
          AZURE_OPENAI_ENDPOINT: ""

  opa-test:
    name: OPA Policy Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -L -o "$RUNNER_TEMP/bin/opa" \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x "$RUNNER_TEMP/bin/opa"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check legacy Rego policy syntax
        run: |
          opa check --v0-compatible \
            policies/agent_actions.rego \
            policies/filesystem.rego \
            policies/network.rego \
            policies/secrets.rego \
            policies/product_workflow.rego

      - name: Check Rego v1 policy syntax
        run: |
          opa check \
            policies/delegation.rego \
            policies/excessive_agency.rego \
            policies/prompt_injection.rego

      - name: Check product workflow release gate
        run: |
          cat > /tmp/no-go-agent.json <<'JSON'
          {
            "review_decision": "no_go",
            "risk_tier": "high",
            "owners": [{"email": "security@example.com"}],
            "business_purpose": "Analyze sensitive data with network tools.",
            "red_team_results": [
              {"status": "fail", "critical": true}
            ]
          }
          JSON
          test "$(opa eval \
            --v0-compatible \
            --data policies/product_workflow.rego \
            --input /tmp/no-go-agent.json \
            --format raw \
            'data.agent.product_workflow.deploy_allowed')" = "false"
          opa eval \
            --v0-compatible \
            --data policies/product_workflow.rego \
            --input /tmp/no-go-agent.json \
            --format raw \
            'data.agent.product_workflow.deny' \
            | grep -q '"critical_red_team_failure"'

  bicep-lint:
    name: Bicep Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -Lo "$RUNNER_TEMP/bin/bicep" \
            https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x "$RUNNER_TEMP/bin/bicep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint Bicep files
        run: |
          bicep lint infra/main.bicep
          for f in infra/modules/*.bicep; do
            echo "Linting $f..."
            bicep lint "$f"
          done

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push on PR)
        uses: docker/build-push-action@v5
        with:
          context: app/
          push: false
          tags: ai-sandbox/orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
